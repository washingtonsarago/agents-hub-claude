name: Regen manifest

on:
  pull_request:
    branches: [main]
    paths:
      - 'agents/**.md'
      - 'commands/**.md'
      - 'skills/**'
      - 'scripts/regen-manifest.js'
      - '.github/workflows/regen-manifest.yml'
  push:
    branches: [main]
    paths:
      - 'agents/**.md'
      - 'commands/**.md'
      - 'skills/**'
      - 'scripts/regen-manifest.js'

jobs:
  check:
    name: Check manifest is in sync (PRs)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify manifest has no drift
        run: node scripts/regen-manifest.js --check

  regen:
    name: Regenerate manifest on push to main
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Regenerate manifest
        id: regen
        run: |
          node scripts/regen-manifest.js
          if [ -n "$(git status --porcelain manifest.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit manifest update
        if: steps.regen.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "chore(manifest): regen on push to main [skip ci]"
          git push
